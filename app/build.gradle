plugins { id 'com.android.application' }

android {
    namespace 'de.hamid.lumatv'
    compileSdk 34
    defaultConfig {
        applicationId 'de.horizonhome.tv'
        minSdk 28
        targetSdk 34
        versionCode 10
        versionName '0.9.0-juke'
    }
    flavorDimensions 'entry'
    productFlavors {
        preview {
            dimension 'entry'
            applicationIdSuffix '.preview'
            manifestPlaceholders = [appLabel: 'Juke TV Vorschau']
        }
        home {
            dimension 'entry'
            manifestPlaceholders = [appLabel: 'Juke TV']
        }
    }
    signingConfigs {
        // Same key on every build, so a new APK installs over the old one and keeps its settings.
        debug {
            storeFile file('horizon-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    androidResources {
        // Variable fonts are opened directly from assets.
        noCompress 'ttf'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// Deliberately no runtime libraries. Android framework only.
